name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: c3fmt-linux
            artifact-path: build/c3fmt
          - os: macos-latest
            artifact-name: c3fmt-macos
            artifact-path: build/c3fmt
          - os: windows-latest
            artifact-name: c3fmt-windows
            artifact-path: build/c3fmt.exe
          - os: windows-11-arm
            artifact-name: c3fmt-windows-aarch64
            artifact-path: build/c3fmt.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      # - uses: ManuLinares/setup-c3@v1
      #   with:
      #     version: nightly

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Build c3c with debug symbols
        run: |
          git clone --filter=blob:none https://github.com/c3lang/c3c.git _c3c_src
          cd _c3c_src
          # git checkout b8bcba0b22e88b55495016ce59d405e5d76f950a

          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DC3_FETCH_LLVM=ON
          cmake --build build -j
          C3_OUT="$PWD/build"

          mkdir -p ../c3/lib
          cp -r lib/std ../c3/lib/
          echo "$C3_OUT" >> "$GITHUB_PATH"
          "$C3_OUT/c3c" --version

      - name: Build tree-sitter static library
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y musl-tools musl-dev cmake
          fi
          bash scripts/build_tree_sitter_static.sh

      - name: Run tests
        run: c3c test -vv --test-show-output

      - name: Compile formatted standard library
        working-directory: test/stdlib
        run: c3c build -vv

      - name: Setup static build (Linux)
        if: runner.os == 'Linux'
        run: |
          MUSL_PATH=$(find /usr/lib -maxdepth 3 -name 'crt1.o' -path '*musl*' | head -1 | xargs dirname)
          sed -i "s|/usr/lib/musl/lib|$MUSL_PATH|g" project.json

      - name: Build c3fmt
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            c3c build c3fmt-static -vv
          else
            c3c build c3fmt -vv -O3 -g0
          fi
          build/c3fmt c3/lib/std/collections/ > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  release:
    name: Create Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: staging

      - name: Prepare release files
        run: |
          mkdir dist
          mv staging/c3fmt-linux/c3fmt                dist/c3fmt-linux
          mv staging/c3fmt-macos/c3fmt                dist/c3fmt-macos
          mv staging/c3fmt-windows/c3fmt.exe          dist/c3fmt-windows.exe
          mv staging/c3fmt-windows-aarch64/c3fmt.exe  dist/c3fmt-windows-aarch64.exe

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          generateReleaseNotes: true
          allowUpdates: true
